<style>
  html, body { margin: 0; padding: 0; background: #06060f; }
  #wrap { position: relative; background: #06060f; border-radius: var(--border-radius-lg); overflow: hidden; }
  canvas { display: block; width: 100%; }
  #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 90%; max-width: 420px; }
  #title { font-family: var(--font-sans); font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 0.08em; text-align: center; text-shadow: 0 0 30px rgba(140,160,255,0.6); }
  #input-row { display: flex; width: 100%; gap: 10px; align-items: center; }
  #msg { flex: 1; background: rgba(255,255,255,0.07); border: none; border-radius: 100px; padding: 12px 20px; font-size: 15px; color: rgba(255,255,255,0.9); font-family: var(--font-sans); }
  #msg::placeholder { color: rgba(255,255,255,0.3); }
  #msg:focus { border-color: transparent; box-shadow: none; outline: none; }
  #btn { background: rgba(100,130,255,0.15); border: none; border-radius: 100px; padding: 12px 20px; font-size: 14px; color: rgba(180,200,255,0.9); font-family: var(--font-sans); }
  #btn:hover { background: rgba(100,130,255,0.28); box-shadow: 0 0 16px rgba(100,130,255,0.3); }
  #hint { font-family: var(--font-sans); font-size: 12px; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; }
  #floating { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="floating"></div>
  <div id="ui">
    <div id="title">✦ Cosmos</div>
    <div id="input-row">
      <input id="msg" type="text" placeholder="Écrivez un message aux étoiles…" maxlength="60" autocomplete="off" />
      <button id="btn">Envoyer ↗</button>
    </div>
    <div id="hint">bougez la souris · cliquez pour créer des étoiles</div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, stars = [], mouse = {x:-999,y:-999}, frame = 0;

function resize() {
  W = canvas.width = canvas.offsetWidth;
  H = canvas.height = Math.round(W * 0.56);
  canvas.style.height = H + 'px';
  document.getElementById('wrap').style.height = H + 'px';
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); });

class Star {
  constructor(x, y, big) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? Math.random() * H;
    this.ox = this.x; this.oy = this.y;
    this.r = big ? (Math.random() * 2.5 + 1.5) : (Math.random() * 1.4 + 0.3);
    this.hue = Math.random() * 80 + 200;
    this.sat = Math.random() * 40 + 50;
    this.bright = Math.random() * 30 + 70;
    this.twinkle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.005;
    this.vx = 0; this.vy = 0;
    this.trail = [];
  }
  update() {
    this.twinkle += this.speed;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 120 && dist > 1) {
      const force = (120 - dist) / 120 * 0.35;
      this.vx += dx / dist * force;
      this.vy += dy / dist * force;
    }
    this.vx += (this.ox - this.x) * 0.015;
    this.vy += (this.oy - this.y) * 0.015;
    this.vx *= 0.88; this.vy *= 0.88;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 8) this.trail.shift();
    this.x += this.vx; this.y += this.vy;
  }
  draw() {
    const alpha = 0.65 + Math.sin(this.twinkle) * 0.35;
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (spd > 0.4 && this.trail.length > 1) {
      for (let i = 1; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        ctx.beginPath();
        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
        ctx.strokeStyle = `hsla(${this.hue},${this.sat}%,${this.bright}%,${t*0.4*alpha})`;
        ctx.lineWidth = this.r * t * 0.8;
        ctx.stroke();
      }
    }
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3.5);
    grd.addColorStop(0, `hsla(${this.hue},${this.sat}%,${this.bright}%,${alpha})`);
    grd.addColorStop(0.4, `hsla(${this.hue},${this.sat}%,${this.bright}%,${alpha*0.4})`);
    grd.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*3.5, 0, Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat+20}%,95%,${alpha})`;
    ctx.fill();
  }
}

class Nebula {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.rx = Math.random()*160+60; this.ry = Math.random()*80+30;
    this.hue = Math.random()*120+200; this.alpha = Math.random()*0.04+0.015;
    this.rot = Math.random()*Math.PI; this.drift = (Math.random()-0.5)*0.002;
  }
  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.rotate(this.rot += this.drift);
    const grd = ctx.createRadialGradient(0,0,0,0,0,this.rx);
    grd.addColorStop(0, `hsla(${this.hue},70%,50%,${this.alpha})`);
    grd.addColorStop(0.5, `hsla(${this.hue+30},60%,40%,${this.alpha*0.5})`);
    grd.addColorStop(1, 'transparent');
    ctx.scale(1, this.ry/this.rx);
    ctx.beginPath(); ctx.arc(0,0,this.rx,0,Math.PI*2);
    ctx.fillStyle = grd; ctx.fill(); ctx.restore();
  }
}

let nebulae = [];
function initStars() {
  stars = Array.from({length: 280}, () => new Star());
  nebulae = Array.from({length: 6}, () => new Nebula());
}
initStars();

function drawConstellations() {
  for (let i = 0; i < stars.length; i++) {
    for (let j = i+1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < 55) {
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.strokeStyle = `rgba(180,200,255,${(1-d/55)*0.18})`;
        ctx.lineWidth = 0.4; ctx.stroke();
      }
    }
  }
}

function drawShootingStar() {
  if (frame % 240 === 0) {
    const sx = Math.random()*W*0.6, sy = Math.random()*H*0.4;
    const len = Math.random()*120+60, angle = Math.PI/5+Math.random()*0.3;
    const grd = ctx.createLinearGradient(sx,sy,sx+Math.cos(angle)*len,sy+Math.sin(angle)*len);
    grd.addColorStop(0,'transparent');
    grd.addColorStop(0.4,'rgba(220,235,255,0.7)');
    grd.addColorStop(1,'rgba(200,220,255,0.9)');
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(angle)*len, sy+Math.sin(angle)*len);
    ctx.strokeStyle = grd; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function loop() {
  frame++;
  ctx.fillStyle = 'rgba(6,6,15,0.25)';
  ctx.fillRect(0,0,W,H);
  nebulae.forEach(n => n.draw());
  drawConstellations();
  drawShootingStar();
  stars.forEach(s => { s.update(); s.draw(); });
  requestAnimationFrame(loop);
}
loop();

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX-r.left)*(W/r.width);
  mouse.y = (e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('mouseleave', () => { mouse.x=-999; mouse.y=-999; });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX-r.left)*(W/r.width);
  const cy = (e.clientY-r.top)*(H/r.height);
  for (let i = 0; i < 12; i++) {
    const s = new Star(cx+(Math.random()-0.5)*30, cy+(Math.random()-0.5)*30, Math.random()>0.7);
    s.vx = (Math.random()-0.5)*4; s.vy = (Math.random()-0.5)*4;
    stars.push(s);
    if (stars.length > 450) stars.splice(0, 12);
  }
});

function floatText(text) {
  const el = document.createElement('div');
  el.style.cssText = `position:absolute;font-family:var(--font-sans);font-size:14px;color:rgba(200,215,255,0.9);pointer-events:none;white-space:nowrap;left:${20+Math.random()*60}%;top:${60+Math.random()*20}%;`;
  el.textContent = '✦ ' + text;
  document.getElementById('floating').appendChild(el);
  let t = 0;
  const anim = setInterval(() => {
    t++;
    el.style.opacity = t < 20 ? (t/20) : Math.max(0, 1 - (t-60)/40);
    if (t > 100) { clearInterval(anim); el.remove(); }
  }, 30);
  for (let i = 0; i < 20; i++) {
    const s = new Star(W*0.5+(Math.random()-0.5)*W*0.4, H*0.6+(Math.random()-0.5)*H*0.3, Math.random()>0.5);
    s.vx = (Math.random()-0.5)*6; s.vy = -(Math.random()*4+1);
    stars.push(s);
    if (stars.length > 500) stars.splice(0, 20);
  }
}

function send() {
  const input = document.getElementById('msg');
  const val = input.value.trim();
  if (!val) return;
  floatText(val);
  input.value = '';
  input.focus();
}

document.getElementById('btn').addEventListener('click', send);
document.getElementById('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
