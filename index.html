<style>
  html, body { margin: 0; padding: 0; background: #06060f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #wrap { position: relative; background: #06060f; border-radius: var(--border-radius-lg); overflow: hidden; }
  canvas { display: block; width: 100%; }
  
  /* Boîte de réponse */
  #response-box {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 50, 150, 0.25);
    border: 1px solid rgba(140, 160, 255, 0.4);
    border-radius: 12px;
    padding: 16px 24px;
    max-width: 550px;
    width: 85%;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(100, 130, 255, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
    pointer-events: none;
    z-index: 100;
    max-height: 200px;
    overflow-y: auto;
  }

  #response-box.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  #response-box::-webkit-scrollbar {
    width: 6px;
  }

  #response-box::-webkit-scrollbar-track {
    background: rgba(140, 160, 255, 0.05);
    border-radius: 10px;
  }

  #response-box::-webkit-scrollbar-thumb {
    background: rgba(140, 160, 255, 0.3);
    border-radius: 10px;
  }

  #response-box::-webkit-scrollbar-thumb:hover {
    background: rgba(140, 160, 255, 0.5);
  }

  #response-box-content {
    font-family: inherit;
    font-size: 14px;
    color: rgba(220, 235, 255, 0.98);
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  #response-box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 11px;
    color: rgba(140, 160, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(140, 160, 255, 0.15);
    padding-bottom: 8px;
  }

  #response-box-close {
    background: none;
    border: none;
    color: rgba(140, 160, 255, 0.5);
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    width: auto;
    height: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  #response-box-close:hover {
    color: rgba(140, 160, 255, 0.95);
    background: rgba(140, 160, 255, 0.1);
    border-radius: 4px;
  }

  #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 16px; width: 90%; max-width: 420px; z-index: 10; }
  #title { font-family: inherit; font-size: 28px; font-weight: 600; color: rgba(255,255,255,0.95); letter-spacing: 0.06em; text-align: center; text-shadow: 0 0 30px rgba(140,160,255,0.8), 0 0 60px rgba(100,130,255,0.4); }
  #input-row { display: flex; width: 100%; gap: 10px; align-items: center; }
  #msg { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(140,160,255,0.2); border-radius: 100px; padding: 12px 20px; font-size: 15px; color: rgba(255,255,255,0.95); font-family: inherit; transition: all 0.3s; }
  #msg::placeholder { color: rgba(255,255,255,0.35); }
  #msg:focus { background: rgba(255,255,255,0.12); border-color: rgba(140,160,255,0.5); box-shadow: 0 0 20px rgba(100,130,255,0.2); outline: none; }
  #btn { background: rgba(100,130,255,0.2); border: 1px solid rgba(100,130,255,0.3); border-radius: 100px; padding: 12px 24px; font-size: 14px; color: rgba(180,200,255,0.95); font-family: inherit; cursor: pointer; transition: all 0.3s; font-weight: 500; }
  #btn:hover { background: rgba(100,130,255,0.35); box-shadow: 0 0 20px rgba(100,130,255,0.4); border-color: rgba(100,130,255,0.6); }
  #btn:active { transform: scale(0.98); }
  #btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #hint { font-family: inherit; font-size: 12px; color: rgba(255,255,255,0.25); letter-spacing: 0.02em; }
  #floating { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .message-bubble {
    position: absolute;
    background: rgba(100, 130, 255, 0.12);
    border: 1px solid rgba(140, 160, 255, 0.3);
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 13px;
    color: rgba(220, 235, 255, 0.95);
    font-family: inherit;
    line-height: 1.4;
    max-width: 300px;
    word-wrap: break-word;
    box-shadow: 0 4px 16px rgba(100, 130, 255, 0.15);
    backdrop-filter: blur(8px);
    animation: floatUp 3s ease-out forwards;
    z-index: 50;
  }

  .message-bubble.response {
    background: rgba(60, 100, 200, 0.15);
    border-color: rgba(140, 180, 255, 0.4);
  }

  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translateY(10px) scale(0.9);
    }
    10% {
      opacity: 1;
    }
    80% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateY(-80px) scale(1);
    }
  }
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="floating"></div>
  
  <!-- Boîte de réponse permanente -->
  <div id="response-box">
    <div id="response-box-header">
      <span>✧ Réponse du cosmos</span>
      <button id="response-box-close">✕</button>
    </div>
    <div id="response-box-content"></div>
  </div>

  <div id="ui">
    <div id="title">✦ Cosmos</div>
    <div id="input-row">
      <input id="msg" type="text" placeholder="Écrivez un message aux étoiles…" maxlength="200" autocomplete="off" />
      <button id="btn">Envoyer</button>
    </div>
    <div id="hint">bougez la souris · cliquez pour créer des étoiles</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, stars = [], mouse = {x:-999,y:-999}, frame = 0;

// Déterminer l'URL de l'API
const API_URL = window.location.hostname === 'localhost' 
  ? 'http://localhost:3000/api/message'
  : `${window.location.origin}/.netlify/functions/message`;

console.log('API URL:', API_URL);

function resize() {
  W = canvas.width = canvas.offsetWidth;
  H = canvas.height = Math.round(W * 0.56);
  canvas.style.height = H + 'px';
  document.getElementById('wrap').style.height = H + 'px';
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); });

class Star {
  constructor(x, y, big) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? Math.random() * H;
    this.ox = this.x; this.oy = this.y;
    this.r = big ? (Math.random() * 2.5 + 1.5) : (Math.random() * 1.4 + 0.3);
    this.hue = Math.random() * 80 + 200;
    this.sat = Math.random() * 40 + 50;
    this.bright = Math.random() * 30 + 70;
    this.twinkle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 0.02 + 0.005;
    this.vx = 0; this.vy = 0;
    this.trail = [];
  }
  update() {
    this.twinkle += this.speed;
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 120 && dist > 1) {
      const force = (120 - dist) / 120 * 0.35;
      this.vx += dx / dist * force;
      this.vy += dy / dist * force;
    }
    this.vx += (this.ox - this.x) * 0.015;
    this.vy += (this.oy - this.y) * 0.015;
    this.vx *= 0.88; this.vy *= 0.88;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 8) this.trail.shift();
    this.x += this.vx; this.y += this.vy;
  }
  draw() {
    const alpha = 0.65 + Math.sin(this.twinkle) * 0.35;
    const spd = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (spd > 0.4 && this.trail.length > 1) {
      for (let i = 1; i < this.trail.length; i++) {
        const t = i / this.trail.length;
        ctx.beginPath();
        ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
        ctx.strokeStyle = `hsla(${this.hue},${this.sat}%,${this.bright}%,${t*0.4*alpha})`;
        ctx.lineWidth = this.r * t * 0.8;
        ctx.stroke();
      }
    }
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3.5);
    grd.addColorStop(0, `hsla(${this.hue},${this.sat}%,${this.bright}%,${alpha})`);
    grd.addColorStop(0.4, `hsla(${this.hue},${this.sat}%,${this.bright}%,${alpha*0.4})`);
    grd.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*3.5, 0, Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat+20}%,95%,${alpha})`;
    ctx.fill();
  }
}

class Nebula {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random()*W; this.y = Math.random()*H;
    this.rx = Math.random()*160+60; this.ry = Math.random()*80+30;
    this.hue = Math.random()*120+200; this.alpha = Math.random()*0.04+0.015;
    this.rot = Math.random()*Math.PI; this.drift = (Math.random()-0.5)*0.002;
  }
  draw() {
    ctx.save(); ctx.translate(this.x, this.y);
    ctx.rotate(this.rot += this.drift);
    const grd = ctx.createRadialGradient(0,0,0,0,0,this.rx);
    grd.addColorStop(0, `hsla(${this.hue},70%,50%,${this.alpha})`);
    grd.addColorStop(0.5, `hsla(${this.hue+30},60%,40%,${this.alpha*0.5})`);
    grd.addColorStop(1, 'transparent');
    ctx.scale(1, this.ry/this.rx);
    ctx.beginPath(); ctx.arc(0,0,this.rx,0,Math.PI*2);
    ctx.fillStyle = grd; ctx.fill(); ctx.restore();
  }
}

let nebulae = [];
function initStars() {
  stars = Array.from({length: 280}, () => new Star());
  nebulae = Array.from({length: 6}, () => new Nebula());
}
initStars();

function drawConstellations() {
  for (let i = 0; i < stars.length; i++) {
    for (let j = i+1; j < stars.length; j++) {
      const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if (d < 55) {
        ctx.beginPath();
        ctx.moveTo(stars[i].x, stars[i].y);
        ctx.lineTo(stars[j].x, stars[j].y);
        ctx.strokeStyle = `rgba(180,200,255,${(1-d/55)*0.18})`;
        ctx.lineWidth = 0.4; ctx.stroke();
      }
    }
  }
}

function drawShootingStar() {
  if (frame % 240 === 0) {
    const sx = Math.random()*W*0.6, sy = Math.random()*H*0.4;
    const len = Math.random()*120+60, angle = Math.PI/5+Math.random()*0.3;
    const grd = ctx.createLinearGradient(sx,sy,sx+Math.cos(angle)*len,sy+Math.sin(angle)*len);
    grd.addColorStop(0,'transparent');
    grd.addColorStop(0.4,'rgba(220,235,255,0.7)');
    grd.addColorStop(1,'rgba(200,220,255,0.9)');
    ctx.beginPath(); ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(angle)*len, sy+Math.sin(angle)*len);
    ctx.strokeStyle = grd; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function loop() {
  frame++;
  ctx.fillStyle = 'rgba(6,6,15,0.25)';
  ctx.fillRect(0,0,W,H);
  nebulae.forEach(n => n.draw());
  drawConstellations();
  drawShootingStar();
  stars.forEach(s => { s.update(); s.draw(); });
  requestAnimationFrame(loop);
}
loop();

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX-r.left)*(W/r.width);
  mouse.y = (e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('mouseleave', () => { mouse.x=-999; mouse.y=-999; });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX-r.left)*(W/r.width);
  const cy = (e.clientY-r.top)*(H/r.height);
  for (let i = 0; i < 12; i++) {
    const s = new Star(cx+(Math.random()-0.5)*30, cy+(Math.random()-0.5)*30, Math.random()>0.7);
    s.vx = (Math.random()-0.5)*4; s.vy = (Math.random()-0.5)*4;
    stars.push(s);
    if (stars.length > 450) stars.splice(0, 12);
  }
});

// Affichage des messages flottants
function floatMessage(text, isResponse = false) {
  const floating = document.getElementById('floating');
  const bubble = document.createElement('div');
  bubble.className = isResponse ? 'message-bubble response' : 'message-bubble';
  
  const x = W * 0.5 + (Math.random() - 0.5) * W * 0.4;
  const y = H * 0.4 + (Math.random() - 0.5) * H * 0.2;
  
  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';
  bubble.textContent = text;
  
  floating.appendChild(bubble);
  
  // Supprimer après l'animation
  setTimeout(() => bubble.remove(), 3100);
  
  // Créer des étoiles
  for (let i = 0; i < 15; i++) {
    const s = new Star(
      x + (Math.random() - 0.5) * 60,
      y + (Math.random() - 0.5) * 60,
      Math.random() > 0.6
    );
    s.vx = (Math.random() - 0.5) * 5;
    s.vy = (Math.random() - 0.5) * 5;
    stars.push(s);
    if (stars.length > 500) stars.splice(0, 15);
  }
}

// Afficher réponse dans la boîte
function showResponseBox(text) {
  const responseBox = document.getElementById('response-box');
  const responseContent = document.getElementById('response-box-content');
  responseContent.textContent = text;
  responseBox.classList.add('show');
}

// Fermer la boîte
function closeResponseBox() {
  const responseBox = document.getElementById('response-box');
  responseBox.classList.remove('show');
}

document.getElementById('response-box-close').addEventListener('click', closeResponseBox);

async function send() {
  const input = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const val = input.value.trim();
  
  if (!val) return;
  
  floatMessage('✦ ' + val, false);
  input.value = '';
  
  btn.disabled = true;
  btn.textContent = 'Pensée...';
  
  try {
    console.log('Envoi du message:', val);
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: val })
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    console.log('Réponse reçue:', data);
    
    if (data.response) {
      floatMessage('✧ ' + data.response, true);
      showResponseBox(data.response);
    } else if (data.error) {
      throw new Error(data.error);
    }
  } catch (error) {
    console.error('Erreur complète:', error);
    const fallback = '✧ Les étoiles sont silencieuses...';
    floatMessage(fallback, true);
    showResponseBox('Erreur de connexion à l\'IA. Vérifiez que le serveur Ollama est actif.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Envoyer';
    input.focus();
  }
}

document.getElementById('btn').addEventListener('click', send);
document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
